# One command, two modes:
#   GPU:   docker compose --profile gpu up --build            (vLLM on the local GPU + gateway)
#   Fake:  docker compose --profile fake up --build           (in-process fake replica + gateway)
# Load generator and report run as one-off services against whichever gateway is up
# (both gateways answer to the network alias "gateway"):
#   docker compose run --rm loadgen --scenario config/scenarios/mixed.yaml --seed 1
#   docker compose run --rm report runs/<run_id>

x-gateway: &gateway
  image: slotgw-gateway:local
  build: .
  volumes:
    - ./config:/app/config:ro
    - ./runs:/app/runs
    - ./calibration:/app/calibration:ro
  ports:
    - "${SLOTGW_PORT:-8080}:8080"
  networks:
    default:
      aliases: [gateway]

x-tool: &tool
  profiles: ["tools"]
  image: slotgw-gateway:local
  build: .
  volumes:
    - ./config:/app/config:ro
    - ./runs:/app/runs

services:
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.32.0}
    command:
      - --model
      - ${HF_MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      - --dtype
      - half
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-32}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEM:-0.82}"
      - --scheduling-policy
      - priority
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-128}"   # prefill chunk size, measured in M3 (A4); vLLM's default is 2048
    ipc: host
    ports:
      - "8000:8000"
    # scripts/vllm-entrypoint.sh works around Docker Desktop's old container toolkit on WSL2
    # (driver 555+ needs libnvdxgdmal.so.1 from the WSL driver store); no-op on other hosts.
    entrypoint: ["bash", "/vllm-entrypoint.sh"]
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./scripts/vllm-entrypoint.sh:/vllm-entrypoint.sh:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 120s

  gateway-gpu:
    <<: *gateway
    profiles: ["gpu"]
    command: ["slotgw", "--port", "8080"]
    environment:
      VLLM_URL: http://vllm:8000
      SLOTGW_RUN_ID: ${RUN_ID:-}
      SLOTGW_PRICE_REFERENCE: ${SLOTGW_PRICE_REFERENCE:-basket-3b}
      SLOTGW_TPS_OVERCOMMIT: ${SLOTGW_TPS_OVERCOMMIT:-1.0}
      SLOTGW_LAZY_PREEMPT: ${SLOTGW_LAZY_PREEMPT:-never}
      SLOTGW_MAX_PREFILL_TOKENS: ${SLOTGW_MAX_PREFILL_TOKENS:-0}
      SLOTGW_PROMPT_USD_PER_MILLION: ${SLOTGW_PROMPT_USD_PER_MILLION:-auto}
    depends_on:
      vllm:
        condition: service_healthy

  fake-replica:
    profiles: ["fake"]
    image: slotgw-gateway:local
    build: .
    command: ["slotgw-fake-replica", "--port", "8001"]
    environment:
      # default curve approximates the 2080 Ti at ~4k context (calibration/local-2080ti.yaml)
      FAKE_RATE_CURVE: ${FAKE_RATE_CURVE:-1:120,2:100,4:70,8:50,12:40,16:32,24:22,32:16}
      FAKE_KV_TOKENS: ${FAKE_KV_TOKENS:-181936}
      FAKE_PREFILL_TPS: ${FAKE_PREFILL_TPS:-2000}
    ports:
      - "8001:8001"

  gateway-fake:
    <<: *gateway
    profiles: ["fake"]
    command: ["slotgw", "--port", "8080"]
    environment:
      VLLM_URL: http://fake-replica:8001
      SLOTGW_RUN_ID: ${RUN_ID:-}
      SLOTGW_PRICE_REFERENCE: ${SLOTGW_PRICE_REFERENCE:-basket-3b}
      SLOTGW_TPS_OVERCOMMIT: ${SLOTGW_TPS_OVERCOMMIT:-1.0}
      SLOTGW_LAZY_PREEMPT: ${SLOTGW_LAZY_PREEMPT:-never}
      SLOTGW_MAX_PREFILL_TOKENS: ${SLOTGW_MAX_PREFILL_TOKENS:-0}
      SLOTGW_PROMPT_USD_PER_MILLION: ${SLOTGW_PROMPT_USD_PER_MILLION:-auto}
    depends_on:
      - fake-replica

  loadgen:
    <<: *tool
    entrypoint: ["slotgw-loadgen"]
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}

  report:
    <<: *tool
    entrypoint: ["slotgw-report"]

volumes:
  hf-cache:
