[project]
name = "slotgw"
version = "0.1.0"
description = "Time-sliced LLM inference billing PoC: shape-based gateway, scheduler, burst manager, meter, load generator and report"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
slotgw = "slotgw.main:main"
slotgw-fake-replica = "slotgw.replicas.fake_server:main"
slotgw-loadgen = "loadgen.main:main"
slotgw-report = "report.build:main"
slotgw-campaign = "report.campaign:main"
slotgw-fetch-prices = "slotgw.prices:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slotgw", "loadgen", "report"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
