# API keys are local test values for the load generator, not secrets.
tenants:
  - name: notetaker
    api_key: sk-local-notetaker
    default_shape: small.16k.30tps
  - name: agent
    api_key: sk-local-agent
    default_shape: small.8k.60tps
  - name: chat
    api_key: sk-local-chat
    default_shape: small.8k.30tps
  - name: batch
    api_key: sk-local-batch
    default_shape: small.8k.15tps.lazy
  # stage N (RESULTS Q18): a light and a heavy prompt profile, each on a 15 tps and a 30 tps shape
  - name: chat-std
    api_key: sk-local-chat-std
    default_shape: small.8k.15tps
  - name: chat-pro
    api_key: sk-local-chat-pro
    default_shape: small.8k.30tps
  - name: docs-std
    api_key: sk-local-docs-std
    default_shape: small.8k.15tps
  - name: docs-pro
    api_key: sk-local-docs-pro
    default_shape: small.8k.30tps
