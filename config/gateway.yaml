# Gateway behaviour knobs (docs/DESIGN.md sections 5-7). Every key has a default in slotgw/config.py.
pacing:
  enabled: true          # false = milestone-1 passthrough (tokens leave as fast as the engine makes them)
  bucket_depth_s: 1.0    # per-request token bucket depth, in seconds of the shape's rate
admission:
  enabled: true                   # false = milestone-2 behaviour (no ledgers, no queue)
  kv_margin: 0.05                 # A3: KV headroom for block rounding and transient allocations
  tps_margin: 0.10                # A3: calibration noise on the step-rate curve
  tps_overcommit: ${SLOTGW_TPS_OVERCOMMIT:-1.0}             # the vCPU lever: seats = n_max x overcommit
  lazy_max_share: 0.5                                       # lazy shapes hold at most this share of seats
  lazy_preempt: ${SLOTGW_LAZY_PREEMPT:-never}               # never | requeue (interactive evicts lazy)
  max_prefill_tokens_in_flight: ${SLOTGW_MAX_PREFILL_TOKENS:-0}  # prompt tokens prefilling at once; 0 = off
  dispatch_tick_s: 0.25
  reservation_spill: false     # a reserved tenant whose slots are all busy waits for one (no on-demand spill)
  health_interval_s: 5.0
burst:                           # burst manager (docs/DESIGN.md section 7)
  enabled: ${SLOTGW_BURST:-true}
  tps: true                      # lend idle step rate to running requests (delivery above the shape's tps)
  context: true                  # admit over-context requests into free KV, low engine priority
  revoke_policy: ${SLOTGW_BURST_REVOKE:-grace}   # finish | grace | abort, when a guaranteed admission needs the KV
  grace_s: 15
  max_context_tokens: 0          # cap for context bursts; 0 = the model's largest shape context
