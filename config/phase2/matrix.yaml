# Phase 2 run matrix (docs/PHASE2.md section 3), executed on pod A by scripts/runchain.sh:
#   bash scripts/runchain.sh config/phase2/matrix.yaml --max-hours 5 --stop-pods
# Each entry runs once per seed with a fresh gateway (own run id), preflight first; the chain stops
# at the first run that fails any check. `env` is the gateway's environment for that setting, on top
# of runs/phase2/phase2.env (replica URLs); `loadgen_args` go to slotgw-loadgen.
scenario: config/scenarios/mixed-4090.yaml
config_dir: config/phase2
expect_replicas: 3
expect_model: Qwen/Qwen2.5-7B-Instruct-AWQ
expect_calibration: runpod-4090     # preflight: every ledger's calibration source must contain this
report_out: runs/phase2/report
runs:
  - label: burstoff                      # (1) no bursting, on demand
    seeds: [1, 2, 3]
    env: {SLOTGW_BURST: "false"}
    loadgen_args: ["--no-reservations"]
  - label: burst                         # (2) tps + context bursts (grace), on demand
    seeds: [1, 2, 3]
    env: {SLOTGW_BURST: "true", SLOTGW_BURST_REVOKE: grace}
    loadgen_args: ["--no-reservations"]
  - label: resv-split                    # (3) reservations pinned to replica A, the 60 tps shape kept off A
    seeds: [1, 2]
    env: {SLOTGW_BURST: "true", SLOTGW_BURST_REVOKE: grace, REPLICA_A_EXCLUDE: small.8k.60tps}
    loadgen_args: ["--reservation-replica", "runpod-4090-a"]
  - label: resv-shared                   # (4) the same reservations with no placement rule: the lockout on a large replica
    seeds: [1, 2]
    env: {SLOTGW_BURST: "true", SLOTGW_BURST_REVOKE: grace}
    loadgen_args: ["--reservation-replica", "none"]
