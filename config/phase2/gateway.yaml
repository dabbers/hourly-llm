# Phase 2 gateway knobs: the milestone-4 defaults with text capture on (docs/PHASE2.md section 6)
# and the post-M4 context-burst class (DESIGN 12). Every key has a default in slotgw/config.py.
pacing:
  enabled: ${SLOTGW_PACING:-true}
  bucket_depth_s: 1.0
admission:
  enabled: true
  kv_margin: 0.05
  tps_margin: 0.10
  tps_overcommit: ${SLOTGW_TPS_OVERCOMMIT:-1.0}
  lazy_max_share: 0.5
  lazy_preempt: ${SLOTGW_LAZY_PREEMPT:-never}
  max_prefill_tokens_in_flight: ${SLOTGW_MAX_PREFILL_TOKENS:-0}
  prefix_affinity: ${SLOTGW_PREFIX_AFFINITY:-false}       # stage K: a conversation's next turn returns to its last replica when that fits now (never waits)
  prefix_affinity_wait_ms: ${SLOTGW_PREFIX_AFFINITY_WAIT_MS:-0}   # stage L: wait this long for the remembered replica before running elsewhere (0 = never)
  prefix_affinity_queue_lookahead: ${SLOTGW_PREFIX_AFFINITY_QUEUE_LOOKAHEAD:-0}   # stage M: a queued turn among the first N may take a freed seat on its remembered replica ahead of the head (0 = strict FIFO)
  prefix_affinity_pass_window_ms: ${SLOTGW_PREFIX_AFFINITY_PASS_WINDOW_MS:-500}   # stage M: a waiter can be passed only this long after it is first passed
  ingest_new_tokens: ${SLOTGW_INGEST_NEW_TOKENS:-false}   # stage N: count a turn's prompt as the tokens beyond its conversation's previous prompt (prefill cap, fair share)
  ingest_fair_share: ${SLOTGW_INGEST_FAIR_SHARE:-false}   # stage N: serve the interactive queue in weighted fair order over tenants (weight = the shape's tps), not first-in first-out
  ingest_bucket: ${SLOTGW_INGEST_BUCKET:-false}   # stage O: a token bucket on prompt reading per tenant, ratio x the shape's tps per slot
  ingest_bucket_input_ratio: ${SLOTGW_INGEST_BUCKET_RATIO:-10}
  tier_priority: ${SLOTGW_TIER_PRIORITY:-false}   # stage O: the engine schedules a faster shape first
  dispatch_tick_s: 0.25
  reservation_spill: ${SLOTGW_RESERVATION_SPILL:-false}
  health_interval_s: 5.0
burst:
  enabled: ${SLOTGW_BURST:-true}
  tps: true
  context: true
  revoke_policy: ${SLOTGW_BURST_REVOKE:-grace}
  grace_s: 15
  max_context_tokens: 0
  context_tps_class: ${SLOTGW_BURST_CTX_CLASS:-slowest}
  context_max_queue_s: ${SLOTGW_BURST_QUEUE_S:-5}
store_text: ${SLOTGW_STORE_TEXT:-true}
