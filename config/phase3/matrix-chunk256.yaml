# Phase 3 stage H, first half (docs/PHASE3.md): the burst setting with vLLM's prefill chunk halved to
# 256 tokens (--max-num-batched-tokens 256). scripts/stage_h.sh (pod.sh chain <gw> stage-h) restarts every
# engine with the new argument line once the campaign chain is DONE, chains this matrix without --stop-pods
# and goes on to matrix-chunk2048.yaml; by hand: START_ORDER="1 2 0" STAGGER=1 pod.sh vllm <gw> restart ...
# --max-num-batched-tokens 256, pod.sh vllm <gw> status, then
#   bash scripts/pod.sh chain <gw> start config/phase3/matrix-chunk256.yaml --max-hours 2
scenario: config/scenarios/mixed-4090.yaml
config_dir: config/phase2
expect_replicas: 3
expect_model: Qwen/Qwen2.5-7B-Instruct-AWQ
expect_calibration: runpod-4090
kv_spread_max: 0.01          # the chunk size moves the absolute KV budget; the engines must still agree within 1 %
report_out: runs/phase3/report
report_mode: last
continue_on_fail: true
runs:
  - label: chunk256
    seeds: [1, 2]
    env: {SLOTGW_BURST: "true", SLOTGW_BURST_REVOKE: grace}
    loadgen_args: ["--no-reservations"]
