# Phase 3 stage H, second half (docs/PHASE3.md): the burst setting with vLLM's default prefill chunk of
# 2048 tokens (what a deployment that never tuned --max-num-batched-tokens gets). Engines restarted with
# 2048 first (pod.sh vllm <p> restart ...), then the last chain of the campaign, which stops the pods:
#   bash scripts/pod.sh chain <gw> start config/phase3/matrix-chunk2048.yaml --max-hours 2 --stop-pods --stop-grace-min 30
scenario: config/scenarios/mixed-4090.yaml
config_dir: config/phase2
expect_replicas: 3
expect_model: Qwen/Qwen2.5-7B-Instruct-AWQ
expect_calibration: runpod-4090
report_out: runs/phase3/report
report_mode: last
continue_on_fail: true
runs:
  - label: chunk2048
    seeds: [1, 2]
    env: {SLOTGW_BURST: "true", SLOTGW_BURST_REVOKE: grace}
    loadgen_args: ["--no-reservations"]
