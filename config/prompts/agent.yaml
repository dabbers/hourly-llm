        # Billing rules

        This document is the agreement between engineering and finance about how
        ledgerline turns usage into money. Finance signed off on version 1.3 on
        12 September 2026. Any change to the behaviour described here requires a
        new version and a new sign-off; a code change alone is not sufficient.

        ## 1 Scope

        These rules apply to every invoice produced by the monthly run and to any
        ad hoc re-run. They do not apply to quotes, estimates or the usage explorer,
        which may use approximate arithmetic as long as they are labelled as such.

        ## 2 Periods and records

        2.1 A billing period is a calendar month in the tenant's billing timezone.
        2.2 A usage record belongs to the period containing its occurrence time,
        half-open: the first instant of the month is included, the first instant of
        the next month is not.
        2.3 Records that arrive after the run for their period has been produced are
        billed in the next period and flagged as late on the invoice.
        2.4 Correction records carry negative quantities and reduce the quantity of
        the product they correct within the same period. A net negative quantity for
        a product is billed as zero; the balance is handled by a credit note.

        ## 3 Money

        3.1 All monetary arithmetic uses decimal types. Binary floating point is not
        acceptable anywhere between the usage record and the PDF. Loaders must
        convert any numeric input via its string representation.

        3.2 Every amount that is printed on an invoice is quantized to the currency's
        minor unit (two places for every currency we bill in today) using
        round-half-up. Quantization happens once, at the point where the amount
        becomes a displayed value. Intermediate values are not quantized.

        ## 3.3 The invoice must foot

        The subtotal printed on an invoice is the arithmetic sum of the line amounts
        printed on that invoice. Where a line is broken down into sub-lines (tiers),
        the line amount is the arithmetic sum of the printed sub-line amounts. Tax is
        computed on the printed subtotal and quantized; the total is subtotal plus
        tax. A reader with a calculator must be able to reproduce every printed
        total from the printed figures above it. An invoice that does not satisfy
        this property is defective regardless of whether the total is "more
        accurate" in some other sense; auditors check that invoices foot, they do
        not check our arithmetic.

        3.4 Rounding differences introduced by 3.3 are accepted. Over a large tenant
        with many tiers they may amount to a few cents per month in either
        direction. This is the industry norm and finance does not require them to
        be tracked.

        3.5 Tax is applied once, to the subtotal, never per line. Tenants in
        jurisdictions requiring per-line tax are out of scope for version 1.x.

        ## 4 Tiered pricing

        4.1 Tiers are cumulative by quantity and are applied in schedule order. Each
        tier's quantity, unit price and amount are printed as a sub-line so that the
        tenant can verify the calculation.

        4.2 (Added in 1.3, LL-4410.) A tier may carry a minimum charge. If the tier
        has non-zero usage and the usage multiplied by the unit price is below the
        minimum, the minimum is charged for that tier and the sub-line shows the
        minimum with the annotation "minimum". A tier with zero usage is not charged
        a minimum. Minimums are configured per tenant and require sales approval.

        4.3 Fractional quantities are permitted by the schema but no current product
        meters fractionally. If one does, the fractional remainder is billed in the
        tier where it falls, rounded down to the unit.

        ## 5 Re-issue policy

        5.1 An invoice that has been sent to the tenant is immutable. Corrections are
        made by issuing a credit note for the full original amount and a new invoice,
        both referencing the original invoice number.

        5.2 An invoice that has been produced but not yet sent may be regenerated
        without a credit note, provided the invoice number is reused and the
        original PDF is destroyed.

        5.3 A defect that affects the printed total of a sent invoice by any amount,
        including one cent, requires re-issue under 5.1. Finance may batch re-issues
        for the same tenant and defect into a single credit note and invoice per
        affected period. A defect that affects only internal fields (for example
        audit values that are never printed) does not require re-issue.

        5.4 Re-issues must be communicated to the tenant with a plain-language note
        explaining the cause. Engineering provides the note's technical sentence.

        ## 6 Audit fields

        6.1 Each invoice line retains its unquantized amount for audit. This value is
        stored and may be exported to finance on request but is never printed and
        never used in any printed calculation.

        6.2 The run log records, for each tenant, the number of lines, the subtotal,
        the tax and the total, and any warnings raised during assembly. The log is
        retained for seven years.

        ## 7 Change log

        1.0 (March 2025) Initial version.
        1.1 (June 2025) Added 2.3 late records.
        1.2 (January 2026) Added 3.5 after the per-line tax question from Pellworth.
        1.3 (September 2026) Added 4.2 tier minimums (LL-4410); clarified 3.2 that
        intermediate values are not quantized and 6.1 that audit values are never
        used in printed calculations.

        ## Appendix A: worked example of 3.3 with tiers

        A tenant has one tiered product with three tiers: first 1,000 units at 0.0335, next
        4,000 units at 0.0275, thereafter 0.0190. In a month they use 7,250 units.

        Tier 1: 1,000 x 0.0335 = 33.5000, printed as 33.50.
        Tier 2: 4,000 x 0.0275 = 110.0000, printed as 110.00.
        Tier 3: 2,250 x 0.0190 = 42.7500, printed as 42.75 (half-up from 42.750).

        Line amount: 33.50 + 110.00 + 42.75 = 186.25. This is the number printed on the line.
        The unrounded sum is 186.2500, which happens to agree here. Now change tier 3's
        price to 0.0191: 2,250 x 0.0191 = 42.9750, printed as 42.98 (half-up). Printed line:
        33.50 + 110.00 + 42.98 = 186.48. Unrounded sum: 186.4750, which also rounds to
        186.48. Change it once more to 0.0193: 2,250 x 0.0193 = 43.4250, printed 43.43.
        Printed line: 186.93. Unrounded: 186.9250, which rounds half-up to 186.93.
        Agreement is common but not guaranteed: with several tiers each contributing up to
        half a cent of rounding, the printed sum and the once-rounded total can differ by
        up to one cent per tier in the worst case, and a tenant with four tiered lines of
        three tiers each can be off by several cents.

        Rule 3.3 resolves this by definition: the printed line amount is the sum of the
        printed sub-lines, and the printed subtotal is the sum of the printed lines. The
        unrounded values are retained for audit (6.1) and nothing else. If engineering
        believes a more accurate figure should be billed, the correct remedy is to change
        the prices or the tier structure, not to print a total that cannot be reproduced
        from the invoice.

        ## Appendix B: questions finance has been asked

        Q: The customer says our total is a cent higher than their own calculation from our
        sub-lines. Who is right?
        A: If they added our printed figures correctly, they are, and the invoice is
        defective under 3.3 and 5.3.

        Q: Is a one-cent difference material?
        A: Not financially. It is material for audit because it means the invoice does not
        foot, and an invoice that does not foot cannot be relied on as evidence.

        Q: Can we fix a sent invoice by sending a corrected PDF with the same number?
        A: No. 5.1 applies. Credit note and new invoice.

        Q: The run log shows a warning for a tenant. Do we hold the invoice?
        A: A warning that names a printed figure (subtotal, tax, total) means the invoice
        should be held until engineering confirms it foots. Other warnings are informational.

