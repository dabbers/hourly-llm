        """Clock abstraction so that scheduling logic can be tested without sleeping."""
        from __future__ import annotations

        import time
        from typing import Protocol


        class Clock(Protocol):
            def now(self) -> float: ...          # seconds since the epoch, like time.time()
            def monotonic(self) -> float: ...    # for durations
            def sleep(self, seconds: float) -> None: ...


        class SystemClock:
            def now(self) -> float:
                return time.time()

            def monotonic(self) -> float:
                return time.monotonic()

            def sleep(self, seconds: float) -> None:
                time.sleep(seconds)


        class FakeClock:
            """A clock that only moves when told to. now() and monotonic() advance together."""

            def __init__(self, start: float = 0.0) -> None:
                self._now = start
                self._mono = 0.0
                self.sleeps: list[float] = []

            def now(self) -> float:
                return self._now

            def monotonic(self) -> float:
                return self._mono

            def sleep(self, seconds: float) -> None:
                self.sleeps.append(seconds)
                self.advance(seconds)

            def advance(self, seconds: float) -> None:
                if seconds < 0:
                    raise ValueError("FakeClock cannot go backwards")
                self._now += seconds
                self._mono += seconds

