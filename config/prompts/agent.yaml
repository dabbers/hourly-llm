        You are working in the rosterly repository, a small Python web application that
        manages staff rotas for a chain of nine veterinary clinics. Clinic managers upload
        a CSV of shifts each month. Ticket RS-318 asks you to add validation so that the
        import rejects any file in which the same staff member has two shifts that overlap
        in time, and reports every such conflict back to the manager with row numbers,
        instead of silently importing both shifts as it does today.

        The acceptance criteria from the ticket:
        - Overlaps are detected per staff member, per clinic, across the whole file.
        - A shift that ends exactly when the next one starts is not an overlap.
        - Shifts crossing midnight must be handled (the existing format supports them).
        - The error report lists both row numbers and the overlapping interval.
        - Existing valid files must still import unchanged; the current test suite must
          keep passing.

        Repository layout: src/rosterly/importer.py (CSV parsing and import), src/rosterly/
        validators.py (existing row-level checks), fixtures/shifts_sample.csv (a valid
        sample), docs/import-schema.md (the CSV format), tests/test_importer.py.

        Tools: read_file(path), run_tests(path, flags), grep(pattern, path). Decide which
        file to read first and explain why briefly.
      - |
        Tool result (read_file src/rosterly/importer.py):

        """CSV shift import.

        A shift row has: clinic_code, staff_id, date (YYYY-MM-DD), start (HH:MM),
        end (HH:MM), role. If end <= start the shift is assumed to cross midnight and
        ends on the following day. Validation is in two stages: row-level checks in
        validators.py (format, known clinic, known staff, known role), then file-level
        checks here (currently only duplicate rows). Any error aborts the import; the
        caller shows the ImportReport to the manager.
        """
        from __future__ import annotations

        import csv
        import io
        from dataclasses import dataclass, field
        from datetime import date, datetime, time, timedelta

        from rosterly.validators import RowError, validate_row
        from rosterly.models import Shift
        from rosterly import db


        @dataclass
        class ImportReport:
            rows_read: int = 0
            rows_imported: int = 0
            errors: list[RowError] = field(default_factory=list)

            @property
            def ok(self) -> bool:
                return not self.errors


        def _shift_interval(row: dict) -> tuple[datetime, datetime]:
            """Absolute start and end for a parsed row; end rolls to the next day if needed."""
            d = date.fromisoformat(row["date"])
            start = datetime.combine(d, time.fromisoformat(row["start"]))
            end = datetime.combine(d, time.fromisoformat(row["end"]))
            if end <= start:
                end += timedelta(days=1)
            return start, end


        def parse(text: str) -> tuple[list[dict], list[RowError]]:
            """Parse CSV text into row dicts; collect row-level errors with 1-based row numbers
            (row 1 is the header, so the first data row is 2)."""
            reader = csv.DictReader(io.StringIO(text))
            rows: list[dict] = []
            errors: list[RowError] = []
            for number, raw in enumerate(reader, start=2):
                row_errors = validate_row(raw, number)
                if row_errors:
                    errors.extend(row_errors)
                    continue
                raw["_row"] = number
                rows.append(raw)
            return rows, errors


        def _file_level_checks(rows: list[dict]) -> list[RowError]:
            """Checks that need the whole file. Currently: exact duplicate rows."""
            errors: list[RowError] = []
            seen: dict[tuple, int] = {}
            for row in rows:
                key = (row["clinic_code"], row["staff_id"], row["date"], row["start"], row["end"])
                if key in seen:
                    errors.append(RowError(row["_row"], "duplicate", f"identical to row {seen[key]}"))
                else:
                    seen[key] = row["_row"]
            # TODO RS-318: overlapping shifts for the same staff member
            return errors


        def import_shifts(text: str, clinic_scope: set[str] | None = None) -> ImportReport:
            report = ImportReport()
            rows, errors = parse(text)
            report.rows_read = len(rows) + len(errors)
            report.errors.extend(errors)
            if clinic_scope is not None:
                for row in rows:
                    if row["clinic_code"] not in clinic_scope:
                        report.errors.append(RowError(row["_row"], "scope", f"clinic {row['clinic_code']} not in your scope"))
            report.errors.extend(_file_level_checks(rows))
            if not report.ok:
                return report
            with db.transaction():
                for row in rows:
                    start, end = _shift_interval(row)
                    db.upsert_shift(Shift(
                        clinic_code=row["clinic_code"],
                        staff_id=row["staff_id"],
                        start=start,
                        end=end,
                        role=row["role"],
                    ))
                    report.rows_imported += 1
            return report

