        """Test factories. Prices and quantities are passed as strings or ints so that no
        float ever reaches the billing code by accident, except when a test wants one."""
        from datetime import datetime, timezone
        from decimal import Decimal as D
        from itertools import count

        from ledgerline.models import Tenant, UsageRecord

        _ids = count(1)


        def tenant_with(*schedules, tax_rate=D("0.20"), currency="EUR", tenant_id="t-test"):
            return Tenant(
                id=tenant_id,
                name="Test Tenant",
                currency=currency,
                tax_rate=tax_rate,
                schedules={s.product_code: s for s in schedules},
            )


        def record(product_code, quantity, occurred_at=None, currency="EUR"):
            if occurred_at is None:
                occurred_at = datetime(2026, 10, 15, 12, 0, tzinfo=timezone.utc)
            return UsageRecord(
                id=f"u-{next(_ids):06d}",
                product_code=product_code,
                quantity=quantity if isinstance(quantity, float) else D(str(quantity)),
                occurred_at=occurred_at,
                currency=currency,
            )

