        # Integration tests

        These tests run the real scheduler against a real broker and a real database,
        started by compose, with one deliberate exception: time. The scheduler receives a
        FakeClock, and the tests move it explicitly. This is what lets us test backoff
        intervals of minutes in a suite that runs in under a minute, and it is also what
        lets us assert exact scheduled times rather than ranges.

        Conventions:

        1. Every test that cares about time uses the `clock` fixture and never calls
           time.sleep. If you need to wait for the broker or database, poll with a short
           real timeout in a helper, but do not advance the fake clock to do it.
        2. EPOCH is a fixed constant so that assertions can use literal values. Do not
           use time.time() to seed the FakeClock; it makes failures impossible to compare
           across runs.
        3. Assertions on scheduled times use abs=0.001 unless jitter is enabled. If you
           find yourself widening a tolerance, stop and find out why the value moved; the
           clock is fake, so it should not have.
        4. Tests that drive several ticks call run_once() repeatedly and advance the
           clock between calls by exactly the expected delay. This keeps the tick count
           and the clock in lockstep.
        5. The broker and database fixtures purge and truncate before each test, not
           after, so that a failed test leaves its state behind for inspection.

        Runner notes:

        The CI runners are shared virtual machines. Under load, database round trips that
        take 10 ms on a laptop take 200 to 400 ms, and the broker can take a similar time
        to acknowledge a publish. None of this should affect any assertion in this
