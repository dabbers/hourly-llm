        """Retry policy and backoff computation.

        RetryPolicy is constructed once per scheduler and is shared across jobs. It
        is pure: given an attempt number it returns a delay, and given a scheduled
        time and a deadline it says whether the attempt is allowed. The scheduler
        owns the clock; RetryPolicy must never read the system time itself, because
        tests inject a FakeClock into the scheduler and expect retry decisions to be
        reproducible.
        """
        from __future__ import annotations

        import logging
        import random
        import time
        from dataclasses import dataclass
        from typing import Optional

        log = logging.getLogger(__name__)


        @dataclass(frozen=True)
        class RetryDecision:
            allowed: bool
            next_attempt_at: Optional[float]
            reason: str


        @dataclass(frozen=True)
        class RetryPolicy:
            base_seconds: float = 30.0
            factor: float = 2.0
            max_attempts: int = 8
            jitter: float = 0.1          # fraction of the delay, applied symmetrically
            max_delay_seconds: float = 3600.0

            def delay_for(self, attempt: int, rng: random.Random) -> float:
                """Delay before attempt number `attempt + 1`, given `attempt` failures so far."""
                if attempt < 1:
                    raise ValueError("attempt must be >= 1")
                raw = self.base_seconds * (self.factor ** (attempt - 1))
                raw = min(raw, self.max_delay_seconds)
                if self.jitter:
                    spread = raw * self.jitter
                    raw += rng.uniform(-spread, spread)
                return max(raw, 0.0)

            def decide(self, attempt: int, now: float, deadline: Optional[float], rng: random.Random) -> RetryDecision:
                """Decide whether to schedule another attempt.

                `now` is the scheduler's clock reading at the moment of failure.
                `deadline` is an absolute time on the same clock, or None for no deadline.
                """
                if attempt >= self.max_attempts:
                    return RetryDecision(False, None, "max_attempts")
                delay = self.delay_for(attempt, rng)
                scheduled = now + delay
                ok = deadline is None or scheduled <= deadline
                log.debug(
                    "next_attempt attempt=%d delay=%.3f scheduled=%.3f deadline=%s ok=%s",
                    attempt, delay, scheduled, f"{deadline:.3f}" if deadline is not None else "none", ok,
                )
                if deadline is not None:
                    # QR-2190: the admin UI countdown showed negative times for jobs whose
                    # deadline was stored in a different timezone than the scheduler's
                    # clock. Re-check the deadline relative to the real wall clock so the
                    # countdown and the scheduler agree on whether the job is still alive.
                    ok = self._wall_clock_deadline_check(now, scheduled, deadline)
                if not ok:
                    return RetryDecision(False, None, "deadline")
                return RetryDecision(True, scheduled, "scheduled")

            @staticmethod
            def _wall_clock_deadline_check(now: float, scheduled: float, deadline: float) -> bool:
                """Re-check the deadline the way the admin UI countdown sees it.

                `now` was read from the scheduler clock at the start of the tick, but the
                wall clock has moved on since then, and the UI computes remaining time
                from the wall clock. From the UI's point of view the job still has
                (deadline - now) plus the time already spent in this tick before it is
                dead, so credit that elapsed time back. This can only make the check more
                permissive, never less, so it cannot mark a job dead early.
                """
                wall = time.time()
                tick_start = _TICK_START.get()
                elapsed = (wall - tick_start) if tick_start is not None else 0.0
                remaining = deadline - now
                delay = scheduled - now
                ok = delay <= remaining + elapsed
                log.debug(
                    "deadline_check wall=%.3f tick_start=%s elapsed=%.3f remaining=%.3f credited=%.3f delay=%.3f ok=%s",
                    wall, f"{tick_start:.3f}" if tick_start is not None else "none",
                    elapsed, remaining, remaining + elapsed, delay, ok,
                )
                return ok


        # The scheduler records the wall-clock time at the start of each tick so that
        # the deadline check can discount time spent inside the tick. See scheduler.py.
        import contextvars

        _TICK_START: contextvars.ContextVar[Optional[float]] = contextvars.ContextVar("qr_tick_start", default=None)


        def mark_tick_start(wall_time: float) -> None:
            _TICK_START.set(wall_time)


        def seconds_until(deadline: Optional[float], now: float) -> Optional[float]:
            """Used by the admin UI countdown. Clamped at zero."""
            if deadline is None:
                return None
            return max(deadline - now, 0.0)

