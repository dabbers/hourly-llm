        """Rate schedules and tier arithmetic.

        A RateSchedule describes how one product is priced for one tenant. It is
        either flat (one unit price) or tiered (an ordered list of Tier objects,
        each covering a span of quantity at its own unit price). Tiers are
        cumulative: the first `size` units go into tier one, the next `size` units
        into tier two, and so on. A tier with size None is open-ended and must be
        last.

        LL-4410 added an optional minimum charge per tier. The minimum applies when
        the tier has non-zero usage whose raw charge is below the minimum. A tier
        with zero usage is never charged, even if it has a minimum; that was an
        explicit decision by sales, recorded in docs/billing-rules.md 4.2.
        """
        from __future__ import annotations

        from dataclasses import dataclass
        from decimal import Decimal, ROUND_HALF_UP, ROUND_DOWN
        from typing import Optional

        ZERO = Decimal("0")


        @dataclass(frozen=True)
        class Tier:
            label: str
            size: Optional[int]          # None means open-ended
            price: Decimal               # unit price within this tier
            minimum: Optional[Decimal] = None

            def __post_init__(self) -> None:
                if isinstance(self.price, float) or isinstance(self.minimum, float):
                    raise TypeError(f"tier {self.label}: prices must be Decimal, not float")
                if self.size is not None and self.size <= 0:
                    raise ValueError(f"tier {self.label}: size must be positive or None")
                if self.minimum is not None and self.minimum < ZERO:
                    raise ValueError(f"tier {self.label}: minimum must not be negative")


        @dataclass(frozen=True)
        class TierResult:
            """The portion of a quantity that landed in one tier, with that tier's price."""

            label: str
            quantity: Decimal
            price: Decimal
            minimum: Optional[Decimal]

            @property
            def raw_amount(self) -> Decimal:
                return self.quantity * self.price


        @dataclass(frozen=True)
        class RateSchedule:
            product_code: str
            description: str
            flat_price: Optional[Decimal] = None
            tiers: Optional[list[Tier]] = None

            def __post_init__(self) -> None:
                if (self.flat_price is None) == (self.tiers is None):
                    raise ValueError(f"{self.product_code}: exactly one of flat_price or tiers is required")
                if self.tiers is not None:
                    if not self.tiers:
                        raise ValueError(f"{self.product_code}: tiers must not be empty")
                    for tier in self.tiers[:-1]:
                        if tier.size is None:
                            raise ValueError(f"{self.product_code}: only the last tier may be open-ended")
                    labels = [t.label for t in self.tiers]
                    if len(labels) != len(set(labels)):
                        raise ValueError(f"{self.product_code}: tier labels must be unique")

            @property
            def is_tiered(self) -> bool:
                return self.tiers is not None

            def describe(self) -> str:
                """Human-readable summary used in the tenant admin UI and in logs."""
                if not self.is_tiered:
                    return f"{self.description}: {self.flat_price} per unit"
                parts = []
                for tier in self.tiers or []:
                    span = f"up to {tier.size}" if tier.size is not None else "thereafter"
                    extra = f", min {tier.minimum}" if tier.minimum is not None else ""
                    parts.append(f"{tier.label} ({span}) at {tier.price}{extra}")
                return f"{self.description}: " + "; ".join(parts)


        def split_into_tiers(schedule: RateSchedule, quantity: Decimal) -> list[TierResult]:
            """Split `quantity` across the schedule's tiers, in order.

            Returns one TierResult per tier, including tiers that received zero
            quantity, so that the PDF can show the full schedule the tenant is on.
            Callers must not charge a minimum for a tier whose quantity is zero.
            """
            if not schedule.is_tiered:
                raise ValueError(f"{schedule.product_code} is not tiered")
            if quantity < ZERO:
                # Net negative usage for a period (corrections exceeding usage) is
                # billed as zero; the credit is handled by the corrections workflow.
                quantity = ZERO
            results: list[TierResult] = []
            remaining = quantity
            for tier in schedule.tiers or []:
                if tier.size is None:
                    take = remaining
                else:
                    # Quantities are integers for every product we sell today, but the
                    # schema allows fractional usage, so round down into the tier.
                    take = min(remaining, Decimal(tier.size)).quantize(Decimal("1"), rounding=ROUND_DOWN)
                results.append(TierResult(label=tier.label, quantity=take, price=tier.price, minimum=tier.minimum))
                remaining -= take
                if remaining <= ZERO:
                    remaining = ZERO
            if remaining > ZERO:
                # Only reachable if the last tier is not open-ended, which the schedule
                # validator should prevent. Fail loudly rather than silently under-bill.
                raise ValueError(f"{schedule.product_code}: {remaining} units exceed the top tier")
            return results


        def effective_unit_price(schedule: RateSchedule, quantity: Decimal) -> Decimal:
            """Blended price per unit, for the usage explorer. Four-place precision."""
            if quantity <= ZERO:
                return ZERO
            if not schedule.is_tiered:
                return schedule.flat_price or ZERO
            total = sum((r.raw_amount for r in split_into_tiers(schedule, quantity)), ZERO)
            return (total / quantity).quantize(Decimal("0.0001"), rounding=ROUND_HALF_UP)


        def schedules_from_config(raw: dict) -> dict[str, RateSchedule]:
            """Parse the tenant's pricing block from the tenant config file.

            Prices in the config are strings precisely so that they never pass
            through float. A bare number in the config is rejected by the loader.
            """
            out: dict[str, RateSchedule] = {}
            for code, block in raw.items():
                if "flat_price" in block:
                    out[code] = RateSchedule(code, block.get("description", code), flat_price=Decimal(block["flat_price"]))
                else:
                    tiers = [
                        Tier(
                            label=t["label"],
                            size=t.get("size"),
                            price=Decimal(t["price"]),
                            minimum=Decimal(t["minimum"]) if "minimum" in t else None,
                        )
                        for t in block["tiers"]
                    ]
                    out[code] = RateSchedule(code, block.get("description", code), tiers=tiers)
            return out

