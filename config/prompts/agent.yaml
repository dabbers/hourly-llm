        from decimal import Decimal as D

        import pytest

        from ledgerline.billing import apply_credits, build_invoice
        from ledgerline.models import Period, Tenant, UsageRecord
        from ledgerline.rates import RateSchedule, Tier
        from tests.factories import record, tenant_with

        PERIOD = Period.month(2026, 10)


        def flat(code, price, description="flat"):
            return RateSchedule(product_code=code, description=description, flat_price=D(price))


        def tiered(code, tiers, description="tiered"):
            return RateSchedule(product_code=code, description=description, tiers=tiers)


        def test_flat_rate_single_line():
            t = tenant_with(flat("api-calls", "0.0040"))
            inv = build_invoice(t, [record("api-calls", 125000)], PERIOD)
            assert len(inv.lines) == 1
            assert inv.lines[0].amount == D("500.00")
            assert inv.subtotal == D("500.00")


        def test_flat_rate_rounds_half_up():
            t = tenant_with(flat("storage-gb", "0.0235"))
            inv = build_invoice(t, [record("storage-gb", 1)], PERIOD)
            # 0.0235 -> 0.02 with ROUND_HALF_EVEN, 0.02 with HALF_UP too; use 0.025
            t2 = tenant_with(flat("storage-gb", "0.025"))
            inv2 = build_invoice(t2, [record("storage-gb", 1)], PERIOD)
            assert inv.lines[0].amount == D("0.02")
            assert inv2.lines[0].amount == D("0.03")


        def test_flat_rate_multiple_products_sorted():
            t = tenant_with(flat("b-prod", "1.00"), flat("a-prod", "2.00"))
            inv = build_invoice(t, [record("b-prod", 3), record("a-prod", 2)], PERIOD)
            assert [l.product_code for l in inv.lines] == ["a-prod", "b-prod"]
            assert inv.subtotal == D("7.00")


        def test_subtotal_equals_sum_of_lines_flat():
            t = tenant_with(flat("x", "0.33"), flat("y", "0.67"), flat("z", "1.01"))
            inv = build_invoice(t, [record("x", 7), record("y", 11), record("z", 13)], PERIOD)
            assert inv.subtotal == sum(l.amount for l in inv.lines)


        def test_tiered_crosses_boundary():
            sched = tiered("msgs", [Tier("first 1000", 1000, D("0.10")), Tier("over 1000", None, D("0.05"))])
            t = tenant_with(sched)
            inv = build_invoice(t, [record("msgs", 1500)], PERIOD)
            line = inv.lines[0]
            assert line.sub_lines == [("first 1000", D("100.00")), ("over 1000", D("25.00"))]
            assert line.amount == D("125.00")


        def test_tier_minimum_applied_when_below():
            sched = tiered("seats", [Tier("base", 10, D("12.00"), minimum=D("60.00")), Tier("extra", None, D("9.00"))])
            t = tenant_with(sched)
            inv = build_invoice(t, [record("seats", 3)], PERIOD)
            assert inv.lines[0].sub_lines[0] == ("base", D("60.00"))
            assert inv.lines[0].amount == D("60.00")


        def test_tier_minimum_not_applied_when_zero_usage():
            sched = tiered("seats", [Tier("base", 10, D("12.00"), minimum=D("60.00"))])
            t = tenant_with(sched)
            inv = build_invoice(t, [record("seats", 0)], PERIOD)
            assert inv.lines[0].amount == D("0.00")


        def test_tax_applied_once_on_subtotal():
            t = tenant_with(flat("x", "1.00"), tax_rate=D("0.20"))
            inv = build_invoice(t, [record("x", 100)], PERIOD)
            assert inv.tax == D("20.00")
            assert inv.total == D("120.00")


        def test_records_outside_period_dropped(caplog):
            t = tenant_with(flat("x", "1.00"))
            inside = record("x", 1)
            outside = record("x", 1, occurred_at=PERIOD.end)
            inv = build_invoice(t, [inside, outside], PERIOD)
            assert inv.subtotal == D("1.00")
            assert "dropped 1 records" in caplog.text


        def test_mixed_currency_rejected():
            t = tenant_with(flat("x", "1.00"))
            with pytest.raises(ValueError):
                build_invoice(t, [record("x", 1, currency="XXX")], PERIOD)


        def test_unpriced_product_skipped_with_warning(caplog):
            t = tenant_with(flat("x", "1.00"))
            inv = build_invoice(t, [record("x", 1), record("mystery", 5)], PERIOD)
            assert len(inv.lines) == 1
            assert "unpriced product mystery" in caplog.text


        def test_credits_never_go_negative():
            t = tenant_with(flat("x", "1.00"))
            inv = build_invoice(t, [record("x", 10)], PERIOD)
            credited = apply_credits(inv, [D("4.00"), D("8.00")])
            assert credited.total == D("0.00")
            assert credited.credit_applied == D("10.00")


        def test_float_rejected():
            t = tenant_with(flat("x", "1.00"))
            with pytest.raises(TypeError):
                build_invoice(t, [record("x", 1.5)], PERIOD)


        def test_empty_usage_yields_zero_invoice():
            t = tenant_with(flat("x", "1.00"))
            inv = build_invoice(t, [], PERIOD)
            assert inv.lines == []
            assert inv.total == D("0.00")

