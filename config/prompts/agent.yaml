        """Row-level validation for the shift CSV import.

        Each check receives the raw row dict and the 1-based row number and returns a
        list of RowError (possibly empty). validate_row runs all checks and returns
        every error for the row, not just the first, so a manager can fix a file in
        one pass.
        """
        from __future__ import annotations

        import re
        from dataclasses import dataclass
        from datetime import date, datetime, time, timedelta

        from rosterly import db

        STAFF_ID = re.compile(r"^s-\d{3}$")
        CLINIC = re.compile(r"^[A-Z]{3}$")
        ROLES = {"vet", "nurse", "reception", "locum"}
        MAX_SHIFT = timedelta(hours=16)


        @dataclass(frozen=True)
        class RowError:
            row: int
            code: str          # short machine-readable code: format, clinic, staff, role, length, duplicate, scope
            message: str       # shown to the manager

            def __str__(self) -> str:
                return f"row {self.row}: {self.code}: {self.message}"


        def _check_format(row: dict, n: int) -> list[RowError]:
            errors = []
            if not CLINIC.match(row.get("clinic_code", "")):
                errors.append(RowError(n, "format", "clinic_code must be three capital letters"))
            if not STAFF_ID.match(row.get("staff_id", "")):
                errors.append(RowError(n, "format", "staff_id must look like s-123"))
            try:
                date.fromisoformat(row.get("date", ""))
            except ValueError:
                errors.append(RowError(n, "format", f"date {row.get('date')!r} is not YYYY-MM-DD"))
            for field in ("start", "end"):
                try:
                    time.fromisoformat(row.get(field, ""))
                except ValueError:
                    errors.append(RowError(n, "format", f"{field} {row.get(field)!r} is not HH:MM"))
            return errors


        def _check_known(row: dict, n: int) -> list[RowError]:
            errors = []
            if not db.clinic_exists(row["clinic_code"]):
                errors.append(RowError(n, "clinic", f"unknown clinic {row['clinic_code']}"))
            if not db.staff_active(row["staff_id"]):
                errors.append(RowError(n, "staff", f"unknown or inactive staff {row['staff_id']}"))
            if row["role"] not in ROLES:
                errors.append(RowError(n, "role", f"role must be one of {sorted(ROLES)}"))
            return errors


        def _check_length(row: dict, n: int) -> list[RowError]:
            d = date.fromisoformat(row["date"])
            start = datetime.combine(d, time.fromisoformat(row["start"]))
            end = datetime.combine(d, time.fromisoformat(row["end"]))
            if end <= start:
                end += timedelta(days=1)
            if end - start > MAX_SHIFT:
                return [RowError(n, "length", f"shift is {end - start}, maximum is 16 hours (RS-290)")]
            return []


        def validate_row(row: dict, n: int) -> list[RowError]:
            errors = _check_format(row, n)
            if errors:
                return errors          # later checks assume well-formed fields
            errors.extend(_check_known(row, n))
            if any(e.code in ("clinic", "staff") for e in errors):
                return errors
            errors.extend(_check_length(row, n))
            return errors

