        # Shift import CSV format

        One row per shift. Header row required. Encoding UTF-8. Fields:

        | Field       | Format      | Notes                                                   |
        |-------------|-------------|---------------------------------------------------------|
        | clinic_code | 3 letters   | Must be one of the clinics the uploading manager runs   |
        | staff_id    | s-NNN       | Must exist and be active                                |
        | date        | YYYY-MM-DD  | The calendar date the shift starts on                   |
        | start       | HH:MM       | 24-hour, local clinic time                              |
        | end         | HH:MM       | 24-hour; if not after start, the shift ends next day    |
        | role        | text        | vet, nurse, reception, or locum                         |

        Rules:
        1. Rows are validated individually first; any invalid row is reported with its
           row number (header is row 1) and the whole file is rejected.
        2. Exact duplicate rows are rejected; the later row is reported.
        3. A shift may be up to 16 hours long. Longer shifts are rejected (RS-290).
        4. Staff may work at more than one clinic. A staff member who is a locum at one
           clinic may also hold a regular role at another. Rotas are managed per clinic
           but staff availability is global: a person cannot be in two clinics at once.
        5. Importing a file replaces nothing; shifts are upserted by (staff_id, start).
           Re-importing the same file is therefore safe.

        Example of a shift crossing midnight: `HAV,s-118,2026-11-04,20:00,08:00,vet` runs
        from 20:00 on the 4th to 08:00 on the 5th. For overlap purposes it occupies that
        whole interval, including the early hours of the 5th.

