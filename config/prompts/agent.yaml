        Tool result (read_file vendor/advisories/FH-2026-07.md):

        # FH-2026-07: response smuggling via chunked encoding with trusted proxy headers

        Published: 2026-11-02. Severity: high. Affected: fennelhttp >= 3.0.0, < 3.4.2.
        Fixed in: 3.4.2. Also fixed in 3.3.4 (backport, maintenance branch).

        ## Description

        When a Client is constructed with `trust_proxy_headers=True`, fennelhttp accepts a
        `Transfer-Encoding` header supplied by the proxy in preference to the one from the
        origin. A malicious or compromised proxy can declare a chunked body while the
        origin sends a fixed-length one, causing the client to read past the end of the
        first response and treat the start of the next response as the tail of the
        current one. On a pooled connection the following request then receives a body
        that belongs to a different request.

        Clients constructed with the default `trust_proxy_headers=False` are not affected.
        Clients that disable connection pooling (`pool_size=1` with `keep_alive=False`)
        are not affected, because there is no following request on the same connection.

        ## Mitigation

        Upgrade to 3.4.2 or 3.3.4. If you cannot upgrade, set `trust_proxy_headers=False`,
        or set `keep_alive=False`.

        ## Changes in 3.4.x that may affect callers

        - `Client(pool_size=...)` is renamed to `Client(max_connections=...)`. The old
          keyword is accepted with a DeprecationWarning in 3.4.0 and 3.4.1 and removed in
          3.4.2.
        - `Response.json()` now raises `fennelhttp.DecodeError` instead of `ValueError`
          on malformed bodies.
        - Default read timeout changed from 30 seconds to 10 seconds.

        The 3.3.4 backport contains only the security fix and none of the above changes.

        ## Credits

        Reported by the Saltmarsh Bay harbour authority's IT team during a penetration
        test of their marina network.

