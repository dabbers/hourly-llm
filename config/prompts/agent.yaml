        Tool result (read_file docs/design/retry-semantics.md):

        # Retry semantics

        Status: accepted, March 2026. Owner: scheduler team. Last reviewed: July 2026.

        ## Summary

        A job that fails is retried with exponential backoff until one of three things
        happens: it succeeds, it exhausts its attempt budget, or its next attempt would
        land after its deadline. In the last two cases it is marked dead and a
        `job.dead` event is published. Nothing else may mark a job dead.

        ## Definitions

        - Attempt: one invocation of the handler. Attempts are numbered from 1.
        - Delay: the interval between a failure and the next attempt, computed by the
          retry policy from the attempt number only (plus optional jitter).
        - Deadline: an absolute point in time, on the scheduler's clock, after which the
          job must not be attempted. Set by the submitter. Optional.
        - Scheduler clock: the single source of time for all scheduling decisions. In
          production this is the system clock; in tests it is a controllable fake.

        ## Rules

        R1. The next attempt time is `now + delay`, where `now` is the scheduler clock
        reading at the start of the tick in which the failure was recorded. Using the
        tick start rather than the moment of failure makes a tick's decisions
        independent of how long the handlers inside it took to run.

        R2. A retry is allowed if and only if `next_attempt_time <= deadline`. The
        comparison is on the scheduler clock. Equality is allowed: a retry landing
        exactly on the deadline is attempted.

        R3. When a retry is not allowed because of R2, the job is marked dead with
        reason `deadline`. Its `next_attempt_at` is cleared.

        R4. Attempt budget: if `attempt >= max_attempts` after a failure, the job is
        marked dead with reason `max_attempts`, regardless of deadline.

        R5. The retry policy is a pure function of (attempt, now, deadline, rng). It
        must not consult any clock of its own. This is what makes the integration
        tests deterministic and what lets us reason about production behaviour from
        logs: given the logged `now` and `deadline`, the decision must be
        reproducible.

        ## Non-goals

        - Wall-clock accuracy of the admin UI countdown is a display concern. The UI
          may compute "time remaining" however it likes, but it must not influence
          scheduling decisions. If the UI and the scheduler disagree about whether a
          job is alive, the scheduler is right by definition.
        - Timezones. Deadlines are stored as epoch seconds and have no timezone. Any
          timezone handling belongs at the API boundary where deadlines are parsed.

        ## Rationale for R5

        We had an earlier version of the scheduler (2024) where the backoff code read
        the system clock directly. Tests had to sleep for real, took eleven minutes,
        and were still flaky on slow runners because the comparison between a time
        computed in one place and a time read in another could straddle a tick
        boundary. Injecting the clock removed an entire class of bugs. Any change that
        reintroduces a direct clock read into a scheduling decision should be treated
        as a regression of this design, however well-intentioned.

        ## Consequences for production

        Because decisions depend only on the scheduler clock, a system clock step (for
        example an NTP correction) affects when ticks happen but not the arithmetic
        inside a tick. A job can be retried slightly early or late after a step, but it
        cannot be marked dead by a step, since `now` and `deadline` are read from the
        same clock in the same tick.

        ## Testing

        - Unit tests cover delay_for with and without jitter and the max_attempts rule.
        - Integration tests in tests/integration/test_retry.py drive the scheduler
          with a FakeClock against a real broker and database. They assert exact
          scheduled times to within a millisecond, which is only possible because of
          R5.
        - A property test asserts that for any attempt sequence, the decision is
          identical whether the test runs instantly or with a 500 ms sleep inserted
          between the failure and the decision. This test was removed in QR-2190
          because "it tested an implementation detail". It should be restored if
          R5 is to be relied upon.

        ## Open questions

        - Should the deadline comparison use `<` instead of `<=`? Finance-adjacent
          jobs have asked for "strictly before". Not decided; current behaviour is `<=`.

        ## Appendix: the 2024 incident that motivated R5

        On 19 November 2024 a system clock step of 1.4 seconds on the pool a host, caused by
        a misconfigured time daemon after a kernel upgrade, coincided with a tick in which
        the old scheduler compared a scheduled time computed before the step against a
        deadline read after it. Eleven invoice export jobs were marked dead 1.4 seconds
        before their deadlines. They were re-queued by hand the next morning, but two of
        them had already triggered the "export missed" alert to the finance team, who then
        processed the month end manually and did not trust the automated export for the
        following two cycles. The incident review concluded that the problem was not the
        clock step itself but the fact that a scheduling decision had been made from two
        different clock readings. R5 is the direct result: one reading of one clock per
        tick, passed down to every decision made in that tick. The review also noted that
        any future change that "just reads the clock once more to be safe" should be
        rejected in review with a link to this appendix. A secondary conclusion was that
        the scheduler's debug log must contain enough information to replay every decision
        offline; that is why the next_attempt line logs now, delay, scheduled and deadline,
        and why the property test described above existed.

