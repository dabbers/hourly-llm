        """Integration tests for retry and backoff behaviour.

        These run against a real broker and database (see conftest.py) but with a
        FakeClock injected into the scheduler, so that backoff intervals of minutes
        can be tested in milliseconds. The FakeClock starts at a fixed epoch and only
        advances when a test calls clock.advance().
        """
        import pytest

        from quillrun.clock import FakeClock
        from quillrun.models import Job, JobState
        from quillrun.retry import RetryPolicy
        from quillrun.scheduler import Scheduler

        EPOCH = 1_730_000_000.0  # fixed start so that assertions can use literal times


        @pytest.fixture
        def clock():
            return FakeClock(start=EPOCH)


        @pytest.fixture
        def scheduler(broker, db, clock):
            policy = RetryPolicy(base_seconds=2.0, factor=2.0, max_attempts=5, jitter=0.0)
            s = Scheduler(broker=broker, db=db, clock=clock, retry_policy=policy, pool="test")
            yield s
            s.close()


        def _failing_job(deadline_offset: float) -> Job:
            """A job whose handler always raises, with a deadline relative to EPOCH."""
            return Job.new(
                handler="tests.handlers.always_fail",
                payload={},
                deadline=EPOCH + deadline_offset,
                pool="test",
            )


        def test_first_failure_schedules_retry_after_base(scheduler, clock, db):
            job = _failing_job(deadline_offset=600)
            scheduler.submit(job)
            scheduler.run_once()  # attempt 1 fails
            stored = db.get_job(job.id)
            assert stored.state == JobState.WAITING
            assert stored.attempt == 1
            assert stored.next_attempt_at == pytest.approx(EPOCH + 2.0, abs=0.001)


        def test_backoff_doubles_each_attempt(scheduler, clock, db):
            job = _failing_job(deadline_offset=600)
            scheduler.submit(job)
            expected_gaps = [2.0, 4.0, 8.0, 16.0]
            last = EPOCH
            for gap in expected_gaps:
                scheduler.run_once()
                stored = db.get_job(job.id)
                assert stored.next_attempt_at == pytest.approx(last + gap, abs=0.001)
                clock.advance(gap)
                last = stored.next_attempt_at
            scheduler.run_once()  # fifth and final attempt
            assert db.get_job(job.id).state == JobState.DEAD


        @pytest.mark.skip(reason="QR-2217 flaky on CI; re-enable when root cause is fixed")
        def test_backoff_respects_deadline(scheduler, clock, db):
            """A retry that would land after the deadline marks the job dead instead.

            Deadline is 13.95 seconds after EPOCH. Attempts: t=0 fails, retry at 2.0;
            t=2.0 fails, retry at 6.0; t=6.0 fails, retry would be at 14.0 which is
            50 ms past the deadline, so the job must be DEAD after the third attempt
            and never scheduled at 14.0. The 50 ms margin is deliberate: it is the
            boundary case, and R5 says the decision must not depend on real time.
            """
            job = _failing_job(deadline_offset=13.95)
            scheduler.submit(job)

            scheduler.run_once()  # attempt 1 at t=0
            assert db.get_job(job.id).next_attempt_at == pytest.approx(EPOCH + 2.0, abs=0.05)
            clock.advance(2.0)

            scheduler.run_once()  # attempt 2 at t=2
            assert db.get_job(job.id).next_attempt_at == pytest.approx(EPOCH + 6.0, abs=0.05)
            clock.advance(4.0)

            scheduler.run_once()  # attempt 3 at t=6; next would be t=14 > deadline 13.95
            stored = db.get_job(job.id)
            assert stored.state == JobState.DEAD, (
                f"attempt {stored.attempt} scheduled at {stored.next_attempt_at}, "
                f"deadline was {stored.deadline}"
            )
            assert stored.next_attempt_at is None


        def test_deadline_exactly_on_retry_time_is_allowed(scheduler, clock, db):
            """Boundary: a retry landing exactly on the deadline is still attempted."""
            job = _failing_job(deadline_offset=6.0)
            scheduler.submit(job)
            scheduler.run_once()
            clock.advance(2.0)
            scheduler.run_once()
            stored = db.get_job(job.id)
            assert stored.state == JobState.WAITING
            assert stored.next_attempt_at == pytest.approx(EPOCH + 6.0, abs=0.001)


        def test_dead_job_emits_event(scheduler, clock, db, broker):
            job = _failing_job(deadline_offset=1.0)
            scheduler.submit(job)
            scheduler.run_once()
            events = broker.drain("quillrun.events")
            assert any(e["type"] == "job.dead" and e["job_id"] == job.id for e in events)


        def test_jitter_stays_within_bounds(broker, db, clock):
            policy = RetryPolicy(base_seconds=10.0, factor=1.0, max_attempts=3, jitter=0.25)
            s = Scheduler(broker=broker, db=db, clock=clock, retry_policy=policy, pool="test")
            try:
                job = _failing_job(deadline_offset=600)
                s.submit(job)
                s.run_once()
                stored = db.get_job(job.id)
                assert EPOCH + 7.5 <= stored.next_attempt_at <= EPOCH + 12.5
            finally:
                s.close()

