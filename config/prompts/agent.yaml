        """The scheduler loop.

        One Scheduler instance serves one pool. Each call to run_once() performs a
        single tick: lease up to `batch` due jobs from the database, dispatch each to
        its handler, record the outcome, and either acknowledge, reschedule or mark
        dead. run_forever() calls run_once() in a loop with a sleep derived from the
        clock, so that FakeClock-driven tests can also drive run_forever() if needed.

        All time inside the scheduler comes from self.clock. The only exception is
        the wall-clock tick marker used by the retry deadline check (QR-2190), which
        is explicitly about real elapsed time inside a tick and is not part of job
        scheduling arithmetic.
        """
        from __future__ import annotations

        import logging
        import random
        import time
        from typing import Optional

        from quillrun.broker import Broker
        from quillrun.clock import Clock
        from quillrun.db import Database
        from quillrun.models import Job, JobState, Outcome
        from quillrun.retry import RetryPolicy, mark_tick_start

        log = logging.getLogger(__name__)


        class Scheduler:
            def __init__(self, broker: Broker, db: Database, clock: Clock, retry_policy: RetryPolicy,
                         pool: str, batch: int = 50, rng: Optional[random.Random] = None) -> None:
                self.broker = broker
                self.db = db
                self.clock = clock
                self.retry_policy = retry_policy
                self.pool = pool
                self.batch = batch
                self.rng = rng or random.Random(0)
                self._closed = False

        ...

            def run_once(self) -> int:
                """Perform one tick. Returns the number of jobs processed."""
                if self._closed:
                    raise RuntimeError("scheduler is closed")
                now = self.clock.now()
                mark_tick_start(time.time())
                jobs = self.db.lease_due(pool=self.pool, now=now, limit=self.batch, lease_seconds=30)
                log.debug("run_once pool=%s now=%.3f picked=%d", self.pool, now, len(jobs))
                processed = 0
                for job in jobs:
                    outcome = self._dispatch(job)
                    self._record(job, outcome, now)
                    processed += 1
                return processed

            def _dispatch(self, job: Job) -> Outcome:
                handler = self._resolve(job.handler)
                started = self.clock.monotonic()
                try:
                    handler(job.payload)
                except Exception as exc:  # noqa: BLE001 - handlers may raise anything
                    log.debug("job %s attempt=%d failed: %s", job.short_id, job.attempt + 1, type(exc).__name__)
                    return Outcome.failed(exc, duration=self.clock.monotonic() - started)
                return Outcome.succeeded(duration=self.clock.monotonic() - started)

            def _record(self, job: Job, outcome: Outcome, now: float) -> None:
                attempt = job.attempt + 1
                if outcome.ok:
                    self.db.complete(job.id, attempt=attempt, finished_at=now)
                    self.broker.publish("quillrun.events", {"type": "job.done", "job_id": job.id, "attempt": attempt})
                    return
                decision = self.retry_policy.decide(attempt=attempt, now=now, deadline=job.deadline, rng=self.rng)
                if decision.allowed:
                    self.db.reschedule(job.id, attempt=attempt, next_attempt_at=decision.next_attempt_at, error=outcome.error_text)
                    log.debug("job %s rescheduled attempt=%d next=%.3f", job.short_id, attempt, decision.next_attempt_at)
                else:
                    self.db.mark_dead(job.id, attempt=attempt, reason=decision.reason, finished_at=now, error=outcome.error_text)
                    log.debug("job %s marked DEAD reason=%s", job.short_id, decision.reason)
                    self.broker.publish("quillrun.events", {"type": "job.dead", "job_id": job.id, "attempt": attempt, "reason": decision.reason})

            def run_forever(self, idle_sleep: float = 1.0) -> None:
                while not self._closed:
                    processed = self.run_once()
                    if processed == 0:
                        self.clock.sleep(idle_sleep)

            def submit(self, job: Job) -> None:
                self.db.insert(job, next_attempt_at=self.clock.now())

            def close(self) -> None:
                self._closed = True
                self.broker.close()

