        """Invoice assembly for ledgerline.

        This module turns a tenant's usage records for one billing period into an
        Invoice: a list of InvoiceLine objects plus subtotal, tax and total. Rating
        (turning a quantity into money) lives in rates.py. This module is responsible
        for grouping usage by product, applying the tenant's rate schedule, and
        assembling the totals that appear on the PDF.

        Money rules (summarised from docs/billing-rules.md, section 3):
          * all arithmetic is Decimal; a float reaching this module is a bug
          * line amounts are quantized to cents with ROUND_HALF_UP
          * the invoice total is the sum of the line amounts as displayed
        """
        from __future__ import annotations

        import logging
        from dataclasses import dataclass, field
        from decimal import Decimal, ROUND_HALF_UP
        from typing import Callable, Iterable

        from ledgerline.models import Invoice, InvoiceLine, Period, Tenant, UsageRecord
        from ledgerline.rates import RateSchedule, TierResult, split_into_tiers

        log = logging.getLogger(__name__)

        CENT = Decimal("0.01")
        ZERO = Decimal("0")


        def _cents(value: Decimal) -> Decimal:
            """Quantize to two places, half up. Rejects floats loudly."""
            if isinstance(value, float):
                raise TypeError(f"float reached billing arithmetic: {value!r}")
            return value.quantize(CENT, rounding=ROUND_HALF_UP)


        @dataclass
        class _Bucket:
            """All usage for one product code within the period."""

            product_code: str
            quantity: Decimal = ZERO
            records: list[UsageRecord] = field(default_factory=list)

            def add(self, record: UsageRecord) -> None:
                if record.quantity < ZERO:
                    # Negative usage is a correction record; allowed, see rules 2.4.
                    log.info("correction record %s qty=%s", record.id, record.quantity)
                self.quantity += record.quantity
                self.records.append(record)


        def _validate(records: Iterable[UsageRecord], period: Period, tenant: Tenant) -> list[UsageRecord]:
            """Drop records outside the period and refuse mixed currencies.

            Usage loading is supposed to filter by period already, but the loader has
            been wrong before (LL-3902), so this is a cheap second line of defence.
            """
            kept: list[UsageRecord] = []
            dropped = 0
            for record in records:
                if not (period.start <= record.occurred_at < period.end):
                    dropped += 1
                    continue
                if record.currency != tenant.currency:
                    raise ValueError(
                        f"record {record.id} currency {record.currency} does not match "
                        f"tenant {tenant.id} currency {tenant.currency}"
                    )
                kept.append(record)
            if dropped:
                log.warning("tenant %s: dropped %d records outside %s", tenant.id, dropped, period)
            return kept


        def _group(records: Iterable[UsageRecord]) -> dict[str, _Bucket]:
            buckets: dict[str, _Bucket] = {}
            for record in records:
                bucket = buckets.get(record.product_code)
                if bucket is None:
                    bucket = buckets[record.product_code] = _Bucket(record.product_code)
                bucket.add(record)
            return buckets


        def _flat_line(bucket: _Bucket, schedule: RateSchedule) -> InvoiceLine:
            """Flat-rate product: one price for every unit."""
            raw = bucket.quantity * schedule.flat_price
            amount = _cents(raw)
            return InvoiceLine(
                product_code=bucket.product_code,
                description=schedule.description,
                quantity=bucket.quantity,
                unit_price=schedule.flat_price,
                amount=amount,
                raw_amount=raw,
                sub_lines=[],
            )


        def _tiered_line(bucket: _Bucket, schedule: RateSchedule) -> InvoiceLine:
            """Tiered product: the quantity is split across tiers, each priced separately.

            Since LL-4410 a tier may carry a minimum charge: if the tier's raw amount is
            below the minimum, the minimum is charged instead. Each tier is shown on the
            PDF as a sub-line with its own amount, so each is quantized individually.
            The line amount is the sum of the displayed sub-line amounts.
            """
            tiers: list[TierResult] = split_into_tiers(schedule, bucket.quantity)
            sub_lines: list[tuple[str, Decimal]] = []
            raw_total = ZERO
            for tier in tiers:
                raw = tier.quantity * tier.price
                if tier.minimum is not None and ZERO < raw < tier.minimum:
                    log.debug("tier %s below minimum %s, charging minimum", tier.label, tier.minimum)
                    raw = tier.minimum
                raw_total += raw
                sub_lines.append((tier.label, _cents(raw)))
            amount = sum((a for _, a in sub_lines), ZERO)
            return InvoiceLine(
                product_code=bucket.product_code,
                description=schedule.description,
                quantity=bucket.quantity,
                unit_price=None,
                amount=amount,
                raw_amount=raw_total,
                sub_lines=sub_lines,
            )


        def build_invoice(tenant: Tenant, records: Iterable[UsageRecord], period: Period) -> Invoice:
            """Assemble the invoice for one tenant and one period.

            Lines are ordered by product code so that re-runs produce identical PDFs.
            Tax is applied to the subtotal at the tenant's rate and quantized once.
            """
            records = _validate(records, period, tenant)
            buckets = _group(records)
            lines: list[InvoiceLine] = []
            for code in sorted(buckets):
                bucket = buckets[code]
                schedule = tenant.schedule_for(code)
                if schedule is None:
                    log.warning("tenant %s has usage for unpriced product %s; skipping", tenant.id, code)
                    continue
                if schedule.is_tiered:
                    lines.append(_tiered_line(bucket, schedule))
                else:
                    lines.append(_flat_line(bucket, schedule))

            # Subtotal is computed from the unrounded line amounts and rounded once, so
            # that rounding error does not accumulate across many small lines (LL-4410).
            subtotal = _cents(sum((line.raw_amount for line in lines), ZERO))
            tax = _cents(subtotal * tenant.tax_rate)
            total = subtotal + tax

            displayed = sum((line.amount for line in lines), ZERO)
            if displayed != subtotal:
                # Soft check only; finance asked for a warning rather than a failure so
                # that a single odd tenant does not block the whole monthly run.
                log.warning(
                    "foot_check tenant=%s subtotal=%s display_sum=%s delta=%s",
                    tenant.id, subtotal, displayed, subtotal - displayed,
                )

            return Invoice(
                tenant_id=tenant.id,
                period=period,
                lines=lines,
                subtotal=subtotal,
                tax=tax,
                total=total,
                currency=tenant.currency,
            )


        def apply_credits(invoice: Invoice, credits: Iterable[Decimal]) -> Invoice:
            """Subtract outstanding credit notes from the total.

            Credits never make a total negative; any remainder is carried to the next
            period by the caller. Credits are already quantized when stored.
            """
            remaining = invoice.total
            applied = ZERO
            for credit in credits:
                take = min(credit, remaining)
                applied += take
                remaining -= take
                if remaining == ZERO:
                    break
            return invoice.with_credit(applied)


        def build_all(
            tenants: Iterable[Tenant],
            load_usage: Callable[[Tenant, Period], Iterable[UsageRecord]],
            period: Period,
        ) -> list[Invoice]:
            """Convenience wrapper used by tools/run_invoices.py. Fails fast on the first
            tenant that cannot be built; partial runs are worse than no run."""
            invoices: list[Invoice] = []
            for tenant in tenants:
                try:
                    invoices.append(build_invoice(tenant, load_usage(tenant, period), period))
                except Exception:
                    log.exception("invoice build failed for tenant %s", tenant.id)
                    raise
            log.info("built %d invoices for %s", len(invoices), period)
            return invoices

