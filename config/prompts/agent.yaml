        """Thin wrapper around fennelhttp for talking to sensor gateways.

        All pollers go through GatewayClient so that timeouts, retries, logging and
        the user agent are consistent. The wrapper exposes a small surface: get_json
        and get_bytes. Anything else should be added here, not by importing
        fennelhttp in a poller.
        """
        from __future__ import annotations

        import logging
        from typing import Any

        import fennelhttp

        log = logging.getLogger(__name__)

        USER_AGENT = "harbourmaster/2.11"


        class GatewayError(Exception):
            pass


        class GatewayClient:
            def __init__(
                self,
                base_url: str,
                *,
                pool_size: int = 2,
                timeout_seconds: float = 20.0,
                trust_proxy_headers: bool = False,
                retries: int = 2,
            ) -> None:
                self.base_url = base_url.rstrip("/")
                self.retries = retries
                self._client = fennelhttp.Client(
                    base_url=self.base_url,
                    pool_size=pool_size,
                    timeout=fennelhttp.Timeout(connect=5.0, read=timeout_seconds),
                    headers={"User-Agent": USER_AGENT},
                    trust_proxy_headers=trust_proxy_headers,
                    keep_alive=True,
                )

            def get_json(self, path: str) -> Any:
                response = self._get(path)
                try:
                    return response.json()
                except ValueError as exc:
                    raise GatewayError(f"malformed JSON from {self.base_url}{path}") from exc

            def get_bytes(self, path: str) -> bytes:
                return self._get(path).content

            # Gateways behind the Northcove marina proxy need proxy headers trusted so
            # that the real gateway address is logged rather than the proxy's.

            def _get(self, path: str) -> fennelhttp.Response:
                last_exc: Exception | None = None
                for attempt in range(self.retries + 1):
                    try:
                        response = self._client.get(path)
                        if response.status >= 500:
                            raise GatewayError(f"{response.status} from {self.base_url}{path}")
                        return response
                    except (fennelhttp.TransportError, GatewayError) as exc:
                        last_exc = exc
                        log.warning("gateway %s attempt %d failed: %s", self.base_url, attempt + 1, exc)
                assert last_exc is not None
                raise GatewayError(str(last_exc)) from last_exc

            def close(self) -> None:
                self._client.close()

