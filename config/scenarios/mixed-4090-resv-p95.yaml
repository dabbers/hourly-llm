# Phase 3 right-sized reservations (docs/PHASE3.md stage E, label resv-p95): mixed-4090.yaml with the
# chat and note-taker reservations sized to their measured phase-2 peak occupancy and no placement
# rule. 51 of the cluster's 96 seats are then held, so the on-demand tenants (agent, batch) feel it.
name: mixed-4090-resv-p95
hour_length_s: 600
drain_s: 90
sample_interval_s: 2
rate_multiplier: 11
phases:
  - {name: quiet, duration_s: 180, rate_scale: 0.25}
  - {name: ramp, duration_s: 120, rate_scale: 0.6}
  - {name: peak, duration_s: 480, rate_scale: 1.0}
  - {name: quiet2, duration_s: 300, rate_scale: 0.25}
tenants:
  - name: chat
    api_key: sk-local-chat
    shape: small.8k.30tps
    profile: {kind: chat, turns: [3, 10], first_user_tokens: [200, 800], user_tokens_per_turn: [200, 800], output_tokens: [50, 300], think_s: [5, 30]}
    arrivals: {kind: diurnal, rate_per_min: 4.5}
    reservation: {slots: 44}   # phase 3: the measured burstoff p95 (39-46 streams), no replica pin: the scheduler spreads the 44 holds over the replicas
    showcase: {prompts: config/prompts/chat.yaml, every_s: 180, offset_s: 30}
  - name: agent
    api_key: sk-local-agent
    shape: small.8k.60tps
    profile: {kind: agent, steps: [5, 15], first_user_tokens: [1000, 2000], growth_tokens: [500, 1500], output_tokens: [100, 400], pause_s: [1, 5]}
    arrivals: {kind: bursty, rate_on_per_min: 3, rate_off_per_min: 0.5, mean_on_s: 120, mean_off_s: 180}
    showcase: {prompts: config/prompts/agent.yaml, every_s: 240, offset_s: 60}
  - name: notetaker
    api_key: sk-local-notetaker
    shape: small.16k.30tps
    profile: {kind: notetaker, prompt_tokens: [3000, 8000], output_tokens: [150, 400]}
    arrivals: {kind: hourmark, per_mark: 8, sigma_s: 120, background_per_min: 0.5}
    reservation: {slots: 7}    # phase 3: the measured burstoff p95 (4-7), no replica pin
    showcase: {prompts: config/prompts/notetaker.yaml, every_s: 300, offset_s: 90}
  - name: batch
    api_key: sk-local-batch
    shape: small.8k.15tps.lazy
    profile: {kind: batch, prompt_tokens: [500, 2000], output_tokens: [200, 600], concurrency: 12}
    showcase: {prompts: config/prompts/batch.yaml, every_s: 240, offset_s: 120}
