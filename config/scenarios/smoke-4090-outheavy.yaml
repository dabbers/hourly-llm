# Two-minute smoke with the phase-3 out-heavy chat and note-taker profiles (long answers), for the
# fake-replica rehearsal of a per-run scenario override in the chain (config/phase3/matrix-rehearsal.yaml).
name: smoke-4090-outheavy
hour_length_s: 60
drain_s: 45
sample_interval_s: 2
rate_multiplier: 1.0
phases:
  - {name: quiet, duration_s: 30, rate_scale: 0.5}
  - {name: peak, duration_s: 60, rate_scale: 1.0}
  - {name: quiet2, duration_s: 30, rate_scale: 0.5}
tenants:
  - name: chat
    api_key: sk-local-chat
    shape: small.8k.30tps
    profile: {kind: chat, turns: [1, 3], first_user_tokens: [60, 200], user_tokens_per_turn: [40, 150], output_tokens: [300, 800], think_s: [2, 6]}
    arrivals: {kind: diurnal, rate_per_min: 6}
    reservation: {slots: 1, phases: [peak], replica: runpod-4090-a}
    showcase: {prompts: config/prompts/chat.yaml, every_s: 30, offset_s: 5}
  - name: agent
    api_key: sk-local-agent
    shape: small.8k.60tps
    profile: {kind: agent, steps: [2, 5], first_user_tokens: [500, 1000], growth_tokens: [300, 800], output_tokens: [60, 200], pause_s: [1, 3]}
    arrivals: {kind: bursty, rate_on_per_min: 4, rate_off_per_min: 0.5, mean_on_s: 30, mean_off_s: 30}
    showcase: {prompts: config/prompts/agent.yaml, every_s: 60, offset_s: 10, think_s: 1}
  - name: notetaker
    api_key: sk-local-notetaker
    shape: small.16k.30tps
    profile: {kind: notetaker, prompt_tokens: [800, 2000], output_tokens: [400, 1000]}
    arrivals: {kind: hourmark, per_mark: 3, sigma_s: 10, background_per_min: 0.5}
    showcase: {prompts: config/prompts/notetaker.yaml, every_s: 60, offset_s: 20}
  - name: batch
    api_key: sk-local-batch
    shape: small.8k.15tps.lazy
    profile: {kind: batch, prompt_tokens: [400, 1200], output_tokens: [100, 300], concurrency: 1}
    showcase: {prompts: config/prompts/batch.yaml, every_s: 30, offset_s: 15}
